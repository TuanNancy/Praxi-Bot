[package]
name = "desktop-macos"
description = "macOS OS backend: Accessibility API, CGEvent input, and screenshot capture."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
pedantic = "warn"

[dependencies]
desktop-api = { path = "../desktop-api", version = "0.1.0" }
# Encoding lives in the platform-independent `pure` module, so these build on
# every OS (its unit tests run on the Linux and Windows CI runners).
jpeg-encoder.workspace = true
png.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
async-trait.workspace = true
objc2-core-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "CFCGTypes",
] }
objc2-core-graphics = { version = "0.3", default-features = false, features = [
    "std",
    "CGDirectDisplay",
    "CGDataProvider",
    "CGError",
    "CGImage",
    "CGWindow",
] }
tokio.workspace = true
